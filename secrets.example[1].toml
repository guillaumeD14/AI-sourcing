# Copiez ce fichier en .streamlit/secrets.toml (jamais versionné) puis remplacez les valeurs.
# Ce fichier-ci (secrets.example.toml) ne contient que des exemples et peut être versionné.
# Sur Streamlit Community Cloud : collez ces lignes dans App settings > Secrets.

CLOUDINARY_CLOUD_NAME = "VOTRE_CLOUD_NAME"
CLOUDINARY_API_KEY = "VOTRE_API_KEY"
CLOUDINARY_API_SECRET = "VOTRE_API_SECRET"

# Dossier des catalogues dans Cloudinary (défaut identique à l'application d'origine : ai-sourcing/catalogues).
CLOUDINARY_PREFIX = "ai-sourcing/catalogues"

# Clé Tavily : elle commence par « tvly- ».
TAVILY_API_KEY = "VOTRE_CLE_TAVILY"

# Alternative équivalente à CLOUDINARY_CLOUD_NAME / API_KEY / API_SECRET :
# CLOUDINARY_URL = "cloudinary://API_KEY:API_SECRET@CLOUD_NAME"
# Autres options : CLOUDINARY_RESOURCE_TYPES = "raw" (ou "raw,image"), CLOUDINARY_SIGNATURE_ALGORITHM = "sha1" (ou "sha256")
