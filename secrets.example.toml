# Collez ce contenu dans Streamlit Community Cloud > App > Settings > Secrets (ou .streamlit/secrets.toml en local).
# NE JAMAIS commiter de vraies valeurs.

# --- Cloudinary : stockage des catalogues PDF (obligatoire) ---
CLOUDINARY_CLOUD_NAME = "votre_cloud_name"
CLOUDINARY_API_KEY = "votre_api_key"
CLOUDINARY_API_SECRET = "votre_api_secret"
CLOUDINARY_FOLDER = "catalogues"          # dossier racine de vos PDF

# --- Tavily : recherche Internet de fabricants (gratuit, quota mensuel limité) ---
TAVILY_API_KEY = "tvly-xxxxxxxxxxxxxxxx"

# --- Facultatif : description automatique de la photo par IA (la recherche image fonctionne sans) ---
GEMINI_API_KEY = ""                       # gratuit (Google AI Studio) : utilisé en priorité
GEMINI_MODEL = "gemini-3.1-flash-lite"    # à changer si Google renomme ou retire ce modèle
OPENAI_API_KEY = ""                       # payant : utilisé seulement si GEMINI_API_KEY est vide
OPENAI_VISION_MODEL = "gpt-4o-mini"

# --- Facultatif : mot de passe d'accès à l'application (vide = accès libre à qui a le lien) ---
APP_PASSWORD = ""
